name: adk-chatbot
agent_directory: chatbot
language: python
base_template: adk_python
framework: google-adk
create_params:
  # The root agent's ADK name (chatbot/agent.py); also the A2A card's name,
  # which is how Agent Registry lists this agent. Change both together.
  root_agent_name: chatbot
  # The {app_name} the agent is served under; must equal the agent directory.
  app_name: chatbot
  # Makes agents-cli deploy store the served A2A card on the runtime
  # (spec.agent_card), which Agent Registry reads. Missing from manifests
  # generated before the flag existed.
  is_a2a: true
  deployment_target: agent_runtime
  agent_guidance_filename: CLAUDE.md
  cicd_runner: github_actions
  agent_runtime:
    identity_default: agent_identity
acli_version: 1.14.0
region: us-east4
